<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Battle Portal</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 2.5rem; border-radius: 16px; text-align: center; max-width: 400px; width: 90%; }
    h1 { color: #38bdf8; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
    .btn { display: block; width: 100%; padding: 0.9rem; border-radius: 10px; text-decoration: none; font-weight: bold; margin-bottom: 1rem; transition: transform 0.2s; }
    .btn-host { background: #8b5cf6; color: #fff; }
    .btn-player { background: #0284c7; color: #fff; }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ QuizBattle</h1>
    <p>Real-Time Multiplayer Live Quiz Engine</p>
    <a href="host.html" class="btn btn-host">Host a Game Screen</a>
    <a href="player.html" class="btn btn-player">Join as Player Gamepad</a>
  </div>
</body>
</html>
